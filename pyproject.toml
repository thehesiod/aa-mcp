[project]
name = "aa-mcp-server"
version = "0.1.0"
description = "MCP server for read-only American Airlines AAdvantage account access — direct API calls via session cookies extracted from a Chromium login"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
keywords = [
    "american-airlines",
    "aadvantage",
    "mcp",
    "mcp-server",
    "model-context-protocol",
    "claude",
    "loyalty",
    "miles",
]
authors = [{ name = "thehesiod" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business",
]
dependencies = [
    "mcp[cli]>=1.0.0",
    "curl_cffi>=0.7.0",
    "pyjwt>=2.8.0",
    "websockets>=12.0",
    "yarl>=1.9.0",
]

[project.urls]
Homepage = "https://github.com/thehesiod/aa-mcp"
Repository = "https://github.com/thehesiod/aa-mcp"
"Bug Tracker" = "https://github.com/thehesiod/aa-mcp/issues"

[project.scripts]
aa-mcp-server = "aa_mcp_server.server:main"
aa-auth-browser = "aa_mcp_server.auth_browser:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aa_mcp_server"]
